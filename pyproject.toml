[project]
name = "voice-behaviors"
version = "0.1.0"
description = "LiveKit voice agent traced into Braintrust over OpenTelemetry, with span masking"
requires-python = ">=3.11"
dependencies = [
    "braintrust==0.23.0",
    "httpx>=0.28",
    "livekit-agents[openai,silero,turn-detector]~=1.5",
    "openai>=1.0",
    "opentelemetry-sdk>=1.39.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "sounddevice>=0.5",
]

[project.scripts]
voice-behaviors = "voice_behaviors.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_behaviors"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
